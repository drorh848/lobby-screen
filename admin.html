<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ניהול לובי">
<title>ניהול מסך לובי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1220;--bg2:#131d33;--card:#18233c;--card2:#1e2a46;--line:rgba(255,255,255,.09);--text:#f2f4f9;--muted:#93a0ba;
  --gold:#d6ae62;--gold2:#f1d595;--imp:#3d9bff;--urg:#ff4458;--ok:#3ccf8e}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:'Heebo',Arial,sans-serif;background:linear-gradient(170deg,var(--bg),var(--bg2));color:var(--text);
  padding-bottom:calc(90px + env(safe-area-inset-bottom));font-size:16px}
.hidden{display:none!important}
.muted{color:var(--muted)}
input,textarea,select,button{font-family:inherit;font-size:16px;color:var(--text)}
input,textarea{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none}
input:focus,textarea:focus{border-color:var(--gold)}
textarea{resize:vertical;min-height:84px;line-height:1.5}
label.f{display:block;font-size:14px;color:var(--muted);margin:16px 0 6px;font-weight:500}
.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:700;background:var(--card2);cursor:pointer}
.btn.primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1307}
.btn.danger{background:rgba(255,68,88,.15);color:#ff8a96}
.btn.block{width:100%}
.icon-btn{background:var(--card2);border:0;width:40px;height:40px;border-radius:12px;font-size:18px;cursor:pointer}

/* כניסה */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px 24px;text-align:center}
.login-card .logo{font-size:52px}
.login-card h1{font-size:24px;color:var(--gold2);margin:8px 0 2px}
.login-card input{margin-top:12px}
.login-card .btn{margin-top:18px;width:100%}
.err{color:#ff8a96;min-height:20px;margin-top:10px;font-size:14px}

/* ראשי */
.top{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:calc(14px + env(safe-area-inset-top)) 16px 12px;background:rgba(11,18,32,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.t-name{font-size:19px;font-weight:800;color:var(--gold2)}
.status{font-size:13px;color:var(--muted);margin-top:2px}
.tabs{display:flex;gap:8px;padding:12px 16px 4px}
.tab{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px;font-weight:600;cursor:pointer;color:var(--muted)}
.tab.active{background:var(--card2);color:var(--gold2);border-color:rgba(214,174,98,.4)}
.pane{padding:12px 16px}

/* רשימת הודעות */
.mcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;border-right:4px solid var(--line)}
.mcard.important{border-right-color:var(--imp)}
.mcard.urgent{border-right-color:var(--urg)}
.mcard.dim{opacity:.55}
.m-head{display:flex;gap:12px;align-items:flex-start}
.m-icon{font-size:30px;line-height:1}
.m-main{flex:1;min-width:0}
.m-title{font-weight:700;font-size:17px;word-break:break-word}
.m-body{color:#cfd5e3;font-size:14px;margin-top:4px;white-space:pre-line;word-break:break-word}
.m-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:12px;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.07);color:var(--muted)}
.tag.on{background:rgba(60,207,142,.15);color:var(--ok)}
.tag.exp,.tag.off{background:rgba(255,255,255,.06)}
.tag.sched{background:rgba(214,174,98,.15);color:var(--gold2)}
.tag.p-important{background:rgba(61,155,255,.15);color:#8cc4ff}
.tag.p-urgent{background:rgba(255,68,88,.15);color:#ff8a96}
.m-actions{display:flex;gap:8px;margin-top:12px}
.m-actions button{flex:1;padding:9px;font-size:14px}
.empty{text-align:center;color:var(--muted);padding:50px 20px}
.section-title{font-size:13px;color:var(--muted);margin:18px 2px 8px;font-weight:600}

.fab{position:fixed;left:20px;bottom:calc(22px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;border:0;
  background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1307;font-size:34px;font-weight:300;box-shadow:0 10px 30px rgba(0,0,0,.45);cursor:pointer;z-index:20}

/* עורך */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet-card{width:100%;max-width:560px;max-height:94vh;overflow-y:auto;background:var(--bg2);border-radius:22px 22px 0 0;
  padding:18px 18px calc(22px + env(safe-area-inset-bottom));border-top:1px solid var(--line);animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet-head h2{font-size:20px;color:var(--gold2)}
.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.icons button{font-size:24px;padding:8px 0;border-radius:12px;background:var(--card);border:2px solid transparent;cursor:pointer}
.icons button.sel{border-color:var(--gold);background:var(--card2)}
.count{font-size:12px;color:var(--muted);text-align:left;margin-top:4px}
.prio{display:flex;flex-direction:column;gap:8px}
.prio-opt{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;cursor:pointer}
.prio-opt input{width:auto;margin-top:4px;accent-color:var(--gold)}
.prio-opt b{display:block;font-size:16px}
.prio-opt small{display:block;color:var(--muted);font-size:13px;margin-top:2px;line-height:1.4}
.prio-opt:has(input:checked){border-color:var(--gold)}
.prio-opt.imp:has(input:checked){border-color:var(--imp)}
.prio-opt.urg:has(input:checked){border-color:var(--urg)}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.quick button{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:7px 13px;font-size:14px;cursor:pointer}
.quick button.sel{border-color:var(--gold);color:var(--gold2)}
details{margin-top:16px;background:var(--card);border-radius:12px;padding:10px 14px}
summary{cursor:pointer;color:var(--muted);font-size:14px}
.sheet-actions{display:flex;gap:10px;margin-top:22px}
.sheet-actions .btn{flex:1}

/* תצוגה מקדימה */
.preview-wrap{position:relative}
.preview{position:relative;aspect-ratio:16/8;border-radius:14px;overflow:hidden;background:linear-gradient(160deg,#0a1120,#1a2747);border:1px solid var(--line)}
.replay{position:absolute;bottom:8px;left:8px;z-index:5;font-size:12px;padding:5px 10px;border-radius:20px;border:0;background:rgba(0,0,0,.5);cursor:pointer}
.pmsg{position:absolute;inset:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;
  border-radius:10px;border:2px solid transparent;background:rgba(255,255,255,.03);animation:inSlide .9s cubic-bezier(.2,.8,.2,1) both}
.pmsg .pi{font-size:30px;line-height:1;margin-bottom:6px}
.pmsg .pt{font-size:18px;font-weight:800;line-height:1.2}
.pmsg .pb{font-size:12px;color:#d9deea;margin-top:4px;white-space:pre-line;max-height:3.2em;overflow:hidden}
.pmsg .pbadge{position:absolute;top:8px;right:10px;font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px;color:#fff}
.pmsg.important{border-color:rgba(61,155,255,.6);animation:inSlide .9s cubic-bezier(.2,.8,.2,1) both,glowBlue 1.2s ease-in-out .9s 3}
.pmsg.important .pi{animation:pop .6s ease .9s 3}
.pmsg.important .pbadge{background:var(--imp)}
.pmsg.urgent{border-color:var(--urg);background:rgba(255,68,88,.08);animation:inZoom .7s cubic-bezier(.2,1.3,.4,1) both,glowRed 1s ease-in-out .7s 4}
.pmsg.urgent .pt{color:#ff8a96}
.pmsg.urgent .pbadge{background:var(--urg);animation:blink .55s steps(1) 6}
.palert{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;
  background:radial-gradient(circle at 50% 40%,#8c0f22,#2b040b 75%);animation:fadeOut .4s ease 2.6s forwards}
.palert::before{content:'';position:absolute;inset:6px;border:3px solid var(--urg);border-radius:10px;animation:blink .5s steps(1) 5}
.palert .tag2{font-size:9px;letter-spacing:.25em;color:#ffd1d6;font-weight:800;margin-bottom:6px}
.palert .pi{font-size:34px;animation:pop .8s ease 3}
.palert .pt{font-size:20px;font-weight:800;margin-top:4px}
@keyframes inSlide{from{opacity:0;transform:translateX(-8%)}to{opacity:1;transform:none}}
@keyframes inZoom{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes glowBlue{0%,100%{box-shadow:0 0 0 0 rgba(61,155,255,0)}50%{box-shadow:0 0 22px 3px rgba(61,155,255,.8)}}
@keyframes glowRed{0%,100%{box-shadow:0 0 0 0 rgba(255,68,88,0)}50%{box-shadow:0 0 24px 4px rgba(255,68,88,.85)}}
@keyframes pop{50%{transform:scale(1.2)}}
@keyframes blink{50%{opacity:0}}
@keyframes fadeOut{to{opacity:0;visibility:hidden}}

/* הגדרות */
.set-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 16px 18px;margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.switch{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-weight:500}
.switch input{width:22px;height:22px;accent-color:var(--gold)}
.hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}

#toast{position:fixed;bottom:calc(100px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
  background:#24324f;padding:12px 20px;border-radius:12px;font-weight:600;transition:.3s;z-index:90;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

<!-- ===== כניסה ===== -->
<div id="loginView" class="login">
  <div class="login-card">
    <div class="logo">🏢</div>
    <h1>ניהול מסך הלובי</h1>
    <p class="muted" id="loginBldg"></p>
    <input id="email" type="email" placeholder="אימייל" autocomplete="username" dir="ltr">
    <input id="pass" type="password" placeholder="סיסמה" autocomplete="current-password" dir="ltr">
    <button class="btn primary" id="loginBtn">כניסה</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- ===== מסך ראשי ===== -->
<div id="mainView" class="hidden">
  <header class="top">
    <div>
      <div class="t-name" id="topName"></div>
      <div class="status" id="screenStatus">⚪ בודק חיבור מסך…</div>
    </div>
    <button class="icon-btn" id="logoutBtn" title="יציאה">⎋</button>
  </header>
  <nav class="tabs">
    <button class="tab active" data-tab="msgs">📋 הודעות</button>
    <button class="tab" data-tab="settings">⚙️ הגדרות</button>
  </nav>

  <section class="pane" id="pane-msgs">
    <div id="msgList"></div>
    <div class="empty hidden" id="emptyMsgs">אין הודעות עדיין.<br>לחץ על ＋ כדי לפרסם הודעה לדיירים.</div>
  </section>

  <section class="pane hidden" id="pane-settings">
    <div class="set-card">
      <label class="f">שם הבניין (מופיע בראש המסך)</label>
      <input id="sName">
      <label class="f">שורת משנה</label>
      <input id="sSub">
      <label class="f">זמן הצגה לכל הודעה (שניות)</label>
      <input id="sSecs" type="number" min="5" max="60">
    </div>
    <div class="set-card">
      <label class="f">מצב לילה – עמעום המסך</label>
      <div class="row2">
        <div><div class="hint">מ־</div><input id="sNightStart" type="time" dir="ltr"></div>
        <div><div class="hint">עד</div><input id="sNightEnd" type="time" dir="ltr"></div>
      </div>
      <div class="hint">להשאיר ריק כדי לבטל עמעום.</div>
      <label class="switch">הצג זמני שבת <input type="checkbox" id="sShabbat"></label>
    </div>
    <button class="btn primary block" id="saveSettings">שמור הגדרות</button>
    <div style="height:12px"></div>
    <button class="btn block" id="reloadScreen">🔄 רענן את המסך בלובי עכשיו</button>
  </section>

  <button class="fab" id="fab" aria-label="הודעה חדשה">＋</button>
</div>

<!-- ===== עורך הודעה ===== -->
<div id="editor" class="sheet hidden">
  <div class="sheet-card">
    <div class="sheet-head"><h2 id="edTitle">הודעה חדשה</h2><button class="icon-btn" id="edClose">✕</button></div>

    <label class="f">אייקון</label>
    <div class="icons" id="iconGrid"></div>

    <label class="f">כותרת</label>
    <input id="fTitle" maxlength="60" placeholder="לדוגמה: ניקיון חדר מדרגות">

    <label class="f">תוכן ההודעה</label>
    <textarea id="fBody" maxlength="240" placeholder="פרטים לדיירים…"></textarea>
    <div class="count" id="bodyCount">0/240</div>

    <label class="f">איך ההודעה תופיע במסך</label>
    <div class="prio">
      <label class="prio-opt"><input type="radio" name="prio" value="normal" checked>
        <div><b>רגילה</b><small>נכנסת בהחלקה עדינה ומתחלפת בסבב</small></div></label>
      <label class="prio-opt imp"><input type="radio" name="prio" value="important">
        <div><b>חשובה ✨</b><small>זוהרת בכחול 3 פעמים ונעצרת, ומוצגת לפני הרגילות</small></div></label>
      <label class="prio-opt urg"><input type="radio" name="prio" value="urgent">
        <div><b>דחופה 🚨</b><small>משתלטת על כל המסך ל־8 שניות עם מסגרת מהבהבת, ואז נשארת ראשונה בלוח באדום. ההשתלטות חוזרת כל 10 דקות</small></div></label>
    </div>

    <label class="f">תצוגה מקדימה</label>
    <div class="preview-wrap">
      <div class="preview" id="preview"></div>
      <button class="replay" id="replay">▶ הצג שוב</button>
    </div>

    <label class="f">להציג עד</label>
    <div class="quick" id="quickExp">
      <button data-d="1">יום</button><button data-d="3">3 ימים</button><button data-d="7">שבוע</button>
      <button data-d="30">חודש</button><button data-d="0">ללא הגבלה</button>
    </div>
    <input type="datetime-local" id="fExp" dir="ltr">

    <details>
      <summary>אפשרויות נוספות</summary>
      <label class="f">להתחיל להציג מ־ (ריק = מיד)</label>
      <input type="datetime-local" id="fStart" dir="ltr">
      <label class="f">משך הצגה בכל סבב (שניות)</label>
      <input type="number" id="fDur" min="5" max="60" placeholder="ברירת המחדל מההגדרות">
    </details>

    <div class="sheet-actions">
      <button class="btn" id="edCancel">ביטול</button>
      <button class="btn primary" id="edSave">שמור ופרסם</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* =========================================================
   הגדרות – זהות לקובץ index.html
   ========================================================= */
const CONFIG = {
  BUILDING_ID:   'bengurion62a',
  BUILDING_NAME: 'בן גוריון 62 א',
  FIREBASE: {
    apiKey:            'AIzaSyCjps3ba4kHmAuG9H7DxRxm7FCMbzSOvW8',
    authDomain:        'lobby-screen-e6ada.firebaseapp.com',
    databaseURL:       'https://lobby-screen-e6ada-default-rtdb.europe-west1.firebasedatabase.app',
    projectId:         'lobby-screen-e6ada',
    storageBucket:     'lobby-screen-e6ada.firebasestorage.app',
    messagingSenderId: '470411970786',
    appId:             '1:470411970786:web:555edf53bf0765bf16b6bb'
  }
};
const ICONS = ['📢','⚠️','🔧','🧹','🛗','💧','⚡','🔥','🎉','🗑️','🅿️','📦','🔒','🌳','💰','🕯️','❤️','🏠'];
const PR = { urgent: 3, important: 2, normal: 1 };
const PR_LABEL = { normal: 'רגילה', important: 'חשובה', urgent: 'דחופה' };

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
let auth, db, base;
let msgs = {}, settings = {}, lastSeen = 0, editId = null, selIcon = ICONS[0];

function toast(t) {
  const el = $('#toast'); el.textContent = t; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 2200);
}
function toLocalInput(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
}
function fromLocalInput(v) { return v ? new Date(v).getTime() : null; }
function fmt(ts) {
  return new Date(ts).toLocaleString('he-IL', { weekday: 'short', day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' });
}

/* ===== אתחול ===== */
$('#loginBldg').textContent = CONFIG.BUILDING_NAME;
if (typeof firebase === 'undefined') {
  $('#loginErr').textContent = 'אין חיבור לאינטרנט';
} else if (CONFIG.FIREBASE.apiKey.startsWith('REPLACE')) {
  $('#loginErr').textContent = 'יש להגדיר את פרטי Firebase בקובץ';
} else {
  firebase.initializeApp(CONFIG.FIREBASE);
  auth = firebase.auth();
  db = firebase.database();
  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
  auth.onAuthStateChanged(u => u ? enter() : showLogin());
}

function showLogin() {
  $('#loginView').classList.remove('hidden');
  $('#mainView').classList.add('hidden');
}
async function doLogin() {
  $('#loginErr').textContent = '';
  const e = $('#email').value.trim(), p = $('#pass').value;
  if (!e || !p) { $('#loginErr').textContent = 'נא למלא אימייל וסיסמה'; return; }
  try { await auth.signInWithEmailAndPassword(e, p); }
  catch (err) { $('#loginErr').textContent = 'פרטי כניסה שגויים'; }
}
$('#loginBtn').addEventListener('click', doLogin);
$('#pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
$('#logoutBtn').addEventListener('click', () => { if (confirm('להתנתק?')) auth.signOut(); });

let entered = false;
function enter() {
  $('#loginView').classList.add('hidden');
  $('#mainView').classList.remove('hidden');
  if (entered) return;
  entered = true;
  base = db.ref('lobby/' + CONFIG.BUILDING_ID);
  base.child('messages').on('value', s => { msgs = s.val() || {}; renderList(); });
  base.child('settings').on('value', s => { settings = s.val() || {}; fillSettings(); });
  base.child('status/lastSeen').on('value', s => { lastSeen = s.val() || 0; renderStatus(); });
  setInterval(renderStatus, 30000);
  setInterval(renderList, 60000);
}

/* ===== סטטוס מסך ===== */
function renderStatus() {
  const el = $('#screenStatus');
  if (!lastSeen) { el.textContent = '⚪ המסך עוד לא התחבר'; return; }
  const mins = Math.floor((Date.now() - lastSeen) / 60000);
  if (mins < 5) el.textContent = '🟢 המסך בלובי מחובר';
  else el.textContent = '🔴 המסך לא מחובר · נראה לאחרונה ' + fmt(lastSeen);
}

/* ===== טאבים ===== */
$$('.tab').forEach(t => t.addEventListener('click', () => {
  $$('.tab').forEach(x => x.classList.toggle('active', x === t));
  const tab = t.dataset.tab;
  $('#pane-msgs').classList.toggle('hidden', tab !== 'msgs');
  $('#pane-settings').classList.toggle('hidden', tab !== 'settings');
  $('#fab').classList.toggle('hidden', tab !== 'msgs');
}));

/* ===== רשימת הודעות ===== */
function stateOf(m) {
  const n = Date.now();
  if (m.active === false) return ['off', 'מושבתת'];
  if (m.expiresAt && m.expiresAt <= n) return ['exp', 'פג תוקף'];
  if (m.startAt && m.startAt > n) return ['sched', 'מתוזמנת ל־' + fmt(m.startAt)];
  return ['on', 'מוצגת עכשיו'];
}
function renderList() {
  $('#topName').textContent = settings.buildingName || CONFIG.BUILDING_NAME;
  const list = $('#msgList'); list.innerHTML = '';
  const arr = Object.entries(msgs).map(([id, m]) => Object.assign({ id }, m));
  $('#emptyMsgs').classList.toggle('hidden', arr.length > 0);
  const order = { on: 0, sched: 1, off: 2, exp: 3 };
  arr.sort((a, b) => order[stateOf(a)[0]] - order[stateOf(b)[0]] ||
    (PR[b.priority] || 1) - (PR[a.priority] || 1) || (b.createdAt || 0) - (a.createdAt || 0));

  let lastGroup = null;
  arr.forEach(m => {
    const [st, stLabel] = stateOf(m);
    const group = (st === 'on' || st === 'sched') ? 'פעילות' : 'לא מוצגות';
    if (group !== lastGroup) {
      lastGroup = group;
      const h = document.createElement('div'); h.className = 'section-title'; h.textContent = group; list.appendChild(h);
    }
    const prio = PR[m.priority] ? m.priority : 'normal';
    const c = document.createElement('div');
    c.className = 'mcard ' + prio + ((st === 'off' || st === 'exp') ? ' dim' : '');
    c.innerHTML = `
      <div class="m-head"><div class="m-icon"></div><div class="m-main"><div class="m-title"></div><div class="m-body"></div></div></div>
      <div class="m-tags"><span class="tag ${st}"></span><span class="tag p-${prio}">${PR_LABEL[prio]}</span><span class="tag exp-tag"></span></div>
      <div class="m-actions">
        <button class="btn" data-act="edit">✏️ עריכה</button>
        <button class="btn" data-act="toggle">${m.active === false ? '▶️ הפעל' : '⏸️ השבת'}</button>
        <button class="btn danger" data-act="del">🗑️</button>
      </div>`;
    c.querySelector('.m-icon').textContent = m.icon || '📢';
    c.querySelector('.m-title').textContent = m.title || '';
    c.querySelector('.m-body').textContent = m.body || '';
    c.querySelector('.tag.' + st).textContent = stLabel;
    const et = c.querySelector('.exp-tag');
    if (m.expiresAt && st !== 'exp') et.textContent = 'עד ' + fmt(m.expiresAt); else et.remove();
    c.querySelector('[data-act=edit]').onclick = () => openEditor(m.id);
    c.querySelector('[data-act=toggle]').onclick = () => toggleMsg(m.id);
    c.querySelector('[data-act=del]').onclick = () => delMsg(m.id);
    list.appendChild(c);
  });
}
async function toggleMsg(id) {
  const m = msgs[id]; if (!m) return;
  const active = m.active === false;
  try { await base.child('messages/' + id).update({ active }); toast(active ? 'ההודעה הופעלה' : 'ההודעה הושבתה'); }
  catch (e) { toast('שגיאה בשמירה'); }
}
async function delMsg(id) {
  if (!confirm('למחוק את ההודעה לצמיתות?')) return;
  try { await base.child('messages/' + id).remove(); toast('ההודעה נמחקה'); }
  catch (e) { toast('שגיאה במחיקה'); }
}

/* ===== עורך ===== */
const grid = $('#iconGrid');
ICONS.forEach(ic => {
  const b = document.createElement('button'); b.type = 'button'; b.textContent = ic;
  b.onclick = () => { selIcon = ic; markIcon(); renderPreview(true); };
  grid.appendChild(b);
});
function markIcon() { grid.querySelectorAll('button').forEach(b => b.classList.toggle('sel', b.textContent === selIcon)); }
function getPrio() { return document.querySelector('input[name=prio]:checked').value; }
function setPrio(p) { document.querySelector(`input[name=prio][value=${PR[p] ? p : 'normal'}]`).checked = true; }

function setQuick(days) {
  $$('#quickExp button').forEach(b => b.classList.toggle('sel', b.dataset.d === String(days)));
  if (days === 0) { $('#fExp').value = ''; return; }
  const d = new Date(); d.setDate(d.getDate() + days); d.setHours(23, 59, 0, 0);
  $('#fExp').value = toLocalInput(d.getTime());
}
$$('#quickExp button').forEach(b => b.addEventListener('click', () => setQuick(+b.dataset.d)));
$('#fExp').addEventListener('input', () => $$('#quickExp button').forEach(b => b.classList.remove('sel')));

function openEditor(id) {
  editId = id || null;
  const m = id ? msgs[id] : null;
  $('#edTitle').textContent = m ? 'עריכת הודעה' : 'הודעה חדשה';
  selIcon = (m && m.icon) || ICONS[0]; markIcon();
  $('#fTitle').value = m ? (m.title || '') : '';
  $('#fBody').value = m ? (m.body || '') : '';
  setPrio(m ? m.priority : 'normal');
  $('#fStart').value = m ? toLocalInput(m.startAt) : '';
  $('#fDur').value = m && m.duration ? m.duration : '';
  if (m) {
    $('#fExp').value = toLocalInput(m.expiresAt);
    $$('#quickExp button').forEach(b => b.classList.toggle('sel', !m.expiresAt && b.dataset.d === '0'));
  } else setQuick(7);
  updateCount();
  $('#editor').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  renderPreview(true);
}
function closeEditor() {
  $('#editor').classList.add('hidden');
  document.body.style.overflow = '';
  editId = null;
}
$('#fab').addEventListener('click', () => openEditor());
$('#edClose').addEventListener('click', closeEditor);
$('#edCancel').addEventListener('click', closeEditor);
$('#editor').addEventListener('click', e => { if (e.target.id === 'editor') closeEditor(); });

function updateCount() { $('#bodyCount').textContent = $('#fBody').value.length + '/240'; }
$('#fTitle').addEventListener('input', () => renderPreview(false));
$('#fBody').addEventListener('input', () => { updateCount(); renderPreview(false); });
$$('input[name=prio]').forEach(r => r.addEventListener('change', () => renderPreview(true)));
$('#replay').addEventListener('click', () => renderPreview(true));

function renderPreview(replay) {
  const p = $('#preview');
  const title = $('#fTitle').value || 'כותרת ההודעה';
  const body = $('#fBody').value || 'כאן יופיע תוכן ההודעה לדיירים';
  if (!replay && p.querySelector('.pmsg')) {
    p.querySelector('.pmsg .pt').textContent = title;
    p.querySelector('.pmsg .pb').textContent = body;
    const at = p.querySelector('.palert .pt'); if (at) at.textContent = title;
    return;
  }
  const prio = getPrio();
  p.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'pmsg ' + prio;
  el.innerHTML = `${prio !== 'normal' ? `<div class="pbadge">${prio === 'urgent' ? 'דחוף' : 'חשוב'}</div>` : ''}<div class="pi"></div><div class="pt"></div><div class="pb"></div>`;
  el.querySelector('.pi').textContent = selIcon;
  el.querySelector('.pt').textContent = title;
  el.querySelector('.pb').textContent = body;
  if (prio === 'urgent') {
    el.style.animationDelay = '3s, 3.7s';
    const a = document.createElement('div');
    a.className = 'palert';
    a.innerHTML = '<div class="tag2">הודעה דחופה לדיירים</div><div class="pi"></div><div class="pt"></div>';
    a.querySelector('.pi').textContent = selIcon;
    a.querySelector('.pt').textContent = title;
    p.appendChild(a);
  }
  p.appendChild(el);
}

$('#edSave').addEventListener('click', async () => {
  const title = $('#fTitle').value.trim();
  if (!title) { toast('נא למלא כותרת'); $('#fTitle').focus(); return; }
  const expiresAt = fromLocalInput($('#fExp').value);
  const startAt = fromLocalInput($('#fStart').value);
  if (expiresAt && expiresAt <= Date.now()) { toast('תאריך הסיום כבר עבר'); return; }
  if (expiresAt && startAt && startAt >= expiresAt) { toast('תאריך ההתחלה אחרי הסיום'); return; }
  const dur = parseInt($('#fDur').value, 10);
  const data = {
    icon: selIcon,
    title,
    body: $('#fBody').value.trim(),
    priority: getPrio(),
    expiresAt: expiresAt || null,
    startAt: startAt || null,
    duration: dur >= 5 ? Math.min(dur, 60) : null,
    updatedAt: firebase.database.ServerValue.TIMESTAMP
  };
  const btn = $('#edSave'); btn.disabled = true;
  try {
    if (editId) {
      await base.child('messages/' + editId).update(data);
      toast('ההודעה עודכנה');
    } else {
      data.active = true;
      data.createdAt = firebase.database.ServerValue.TIMESTAMP;
      await base.child('messages').push(data);
      toast('ההודעה פורסמה במסך');
    }
    closeEditor();
  } catch (e) {
    toast('שגיאה בשמירה');
  } finally { btn.disabled = false; }
});

/* ===== הגדרות ===== */
function fillSettings() {
  $('#topName').textContent = settings.buildingName || CONFIG.BUILDING_NAME;
  $('#sName').value = settings.buildingName || CONFIG.BUILDING_NAME;
  $('#sSub').value = settings.subtitle != null ? settings.subtitle : 'קרית ביאליק · ברוכים הבאים';
  $('#sSecs').value = settings.msgSeconds || 12;
  $('#sNightStart').value = settings.nightStart != null ? settings.nightStart : '23:30';
  $('#sNightEnd').value = settings.nightEnd != null ? settings.nightEnd : '06:00';
  $('#sShabbat').checked = settings.showShabbat !== false;
}
$('#saveSettings').addEventListener('click', async () => {
  const secs = parseInt($('#sSecs').value, 10);
  try {
    await base.child('settings').update({
      buildingName: $('#sName').value.trim() || CONFIG.BUILDING_NAME,
      subtitle: $('#sSub').value.trim(),
      msgSeconds: secs >= 5 ? Math.min(secs, 60) : 12,
      nightStart: $('#sNightStart').value || '',
      nightEnd: $('#sNightEnd').value || '',
      showShabbat: $('#sShabbat').checked
    });
    toast('ההגדרות נשמרו');
  } catch (e) { toast('שגיאה בשמירה'); }
});
$('#reloadScreen').addEventListener('click', async () => {
  try {
    await base.child('settings').update({ reloadAt: firebase.database.ServerValue.TIMESTAMP });
    toast('נשלחה פקודת רענון למסך');
  } catch (e) { toast('שגיאה'); }
});
</script>
</body>
</html>
